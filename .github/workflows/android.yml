# Compila el APK firmado y lo publica como Release cada vez que cambia la app.
# La app del móvil consulta la última Release y se ofrece a actualizarse.
name: APK Android

on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - sw.js
      - icons/**
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Falta el secreto KEYSTORE_BASE64: se compila para comprobar, pero no se publica la Release."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/finanzapp.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/finanzapp.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PversionCode=$VERSION_CODE -PversionName=1.0.$VERSION_CODE

      - name: Publicar Release
        if: env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk finanzapp.apk
          git log -1 --format='%B' | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' > notas.txt
          gh release create "v$VERSION_CODE" finanzapp.apk \
            --title "FinanzApp 1.0.$VERSION_CODE" \
            --notes-file notas.txt \
            --target "$GITHUB_SHA"
